name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            scripts/requirements-ocf.txt
            scripts/requirements-ocf-recovery.txt
      - name: Install pinned HA test harness
        run: python -m pip install -r requirements-test.txt
      - name: Unit and transport regression tests
        run: python -m unittest discover -s tests -q
      - name: Real HA runtime tests (network blocked)
        run: python -m pytest tests/ha -q
      - name: Lint HA lifecycle, local Repairs and runtime tests
        run: >-
          ruff check
          custom_components/samsung_soundbar/__init__.py
          custom_components/samsung_soundbar/config_flow.py
          custom_components/samsung_soundbar/const.py
          custom_components/samsung_soundbar/api_extension/SoundbarDevice.py
          custom_components/samsung_soundbar/dhcp_recovery.py
          custom_components/samsung_soundbar/device_info.py
          custom_components/samsung_soundbar/entry_migration.py
          custom_components/samsung_soundbar/entry_options.py
          custom_components/samsung_soundbar/entity_updates.py
          custom_components/samsung_soundbar/entity_migrations.py
          custom_components/samsung_soundbar/media_player.py
          custom_components/samsung_soundbar/models.py
          custom_components/samsung_soundbar/number.py
          custom_components/samsung_soundbar/select.py
          custom_components/samsung_soundbar/sensor.py
          custom_components/samsung_soundbar/services.py
          custom_components/samsung_soundbar/switch.py
          custom_components/samsung_soundbar/repairs.py
          tests/ha tests/test_no_cloud_contract.py tests/test_metadata.py
          scripts/extract_ocf_credential.py tests/test_ocf_credential_import.py
          scripts/recover_q800f_credential.py tests/test_ocf_credential_recovery.py
          custom_components/samsung_soundbar/local_ocf.py
          custom_components/samsung_soundbar/local_device.py
          custom_components/samsung_soundbar/local_identity.py
          custom_components/samsung_soundbar/local_rpc.py
          custom_components/samsung_soundbar/ocf_credentials.py
          custom_components/samsung_soundbar/ocf_repairs.py
          custom_components/samsung_soundbar/ocf_state.py
          custom_components/samsung_soundbar/ocf_profiles.py
          custom_components/samsung_soundbar/state.py
          custom_components/samsung_soundbar/coordinator.py
          tests/test_coordinator.py tests/test_hybrid_state.py
          tests/test_local_device_contract.py tests/test_local_transport_state.py
          tests/test_dhcp_recovery.py tests/test_local_identity.py
          tests/test_local_rpc.py tests/test_local_rpc_diagnostics.py
          tests/test_local_ocf.py tests/test_ocf_credentials.py
          tests/test_ocf_state.py
          tests/test_ocf_woofer.py
          tests/test_ocf_advanced_audio.py
          tests/test_ocf_equalizer.py
          tests/test_ocf_eq_controls.py
          custom_components/samsung_soundbar/ocf_equalizer.py
          custom_components/samsung_soundbar/ocf_channels.py
          custom_components/samsung_soundbar/ocf_level_profiles.py
          custom_components/samsung_soundbar/ocf_levels.py
          tests/test_ocf_channel_schema.py tests/test_ocf_level_transport.py
          tests/test_ocf_levels.py
