dump_ocf_status:
  name: Dump local OCF status
  description: Read known audio settings through the saved OCF credential. Returns projected values and freshness, never raw responses or secrets. Does not change device settings.
  fields:
    preset:
      name: Resources preset
      description: Audio reads validated settings. Media performs read-only playback/metadata research, without adding controls or background polling. Explicit hrefs override this preset.
      default: audio
      selector:
        select:
          options:
            - label: Audio settings
              value: audio
            - label: Playback and metadata (read-only)
              value: media
    device_id:
      name: Device
      description: Samsung Soundbar device. Required only when multiple soundbars are loaded.
      selector:
        device:
          integration: samsung_soundbar
    hrefs:
      name: Local resources
      description: Optional subset of fixed audio/media resources; overrides the preset. Empty list returns cached audio diagnostics without new reads.
      selector:
        select:
          multiple: true
          options:
            - /sec/networkaudio/woofer
            - /sec/networkaudio/advancedaudio
            - /sec/networkaudio/spacefitSound
            - /sec/networkaudio/tone
            - /sec/networkaudio/eq
            - /sec/networkaudio/currentEQMode
            - /sec/networkaudio/channelVolume
            - /sec/networkaudio/audiosync
            - /sec/networkaudio/soundFrom
            - /sec/networkaudio/playback
            - /sec/networkaudio/musicinfo
            - /sec/networkaudio/av/audioTrackData
            - /sec/networkaudio/av/mediaPlayback
            - /sec/networkaudio/av/mediaTrackControl
            - /sec/networkaudio/av/mediaPlaybackShuffle
            - /sec/networkaudio/av/mediaPlaybackRepeat

dump_discovery_snapshot:
  name: Dump local discovery snapshot
  description: Return projected local RPC and OCF state, field freshness and pending writes. Never returns credentials or remote status payloads.
  fields:
    device_id:
      name: Device
      description: Samsung Soundbar device. Required only when multiple soundbars are loaded.
      selector:
        device:
          integration: samsung_soundbar
    include_null:
      name: Include unknown values
      default: true
      selector:
        boolean:

dump_local_rpc:
  name: Dump local RPC
  description: Probe the soundbar local JSON-RPC API over LAN. Requires the soundbar IP address and IP Control enabled.
  fields:
    host:
      name: Host
      description: Soundbar IP address or hostname.
      required: true
      example: 192.168.1.50
      selector:
        text:
    port:
      name: Port
      description: Local JSON-RPC HTTPS port.
      required: false
      default: 1516
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    verify_ssl:
      name: Verify SSL
      description: Verify the soundbar HTTPS certificate. Usually disabled because the soundbar uses a self-signed certificate.
      required: false
      default: false
      selector:
        boolean:
    timeout:
      name: Timeout
      description: Request timeout in seconds.
      required: false
      default: 8
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
    methods:
      name: Methods
      description: Local JSON-RPC methods to call after createAccessToken succeeds.
      required: false
      default:
        - powerControl
        - getVolume
        - getMute
        - inputSelectControl
        - soundModeControl
        - getCodec
        - getIdentifier
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - powerControl
            - getVolume
            - getMute
            - inputSelectControl
            - soundModeControl
            - getCodec
            - getIdentifier
            - createAccessToken
    write_method:
      name: Write probe method
      description: Optional local JSON-RPC method to call with write_params after read methods. Direct volumeControl (integer volume 0-100) and muteControl (boolean mute) probes include actual getter readback without changing the integration runtime configuration. This may change the soundbar setting.
      required: false
      example: inputSelectControl
      selector:
        text:
    write_params:
      name: Write probe params
      description: Optional JSON-RPC params for write_method. AccessToken is added automatically.
      required: false
      example:
        inputSource: WIFI_IDLE
      selector:
        object:
